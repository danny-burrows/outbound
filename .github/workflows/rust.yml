name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  docker-build-outbound-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/dev
          tags: outbound-dev:latest
          outputs: type=docker,dest=/tmp/outbound-dev.tar
      - uses: actions/upload-artifact@v7
        with:
          name: outbound-dev
          path: /tmp/outbound-dev.tar

  cargo-check:
    needs: docker-build-outbound-dev
    runs-on: ubuntu-latest
    name: cargo-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --all -- --check
          - name: clippy
            command: cargo clippy --workspace --all-targets --all-features -- --deny warnings
          - name: test
            command: cargo test --workspace --verbose
          # Guards the render feature gating: the simulation must still build and pass
          # without raylib, which is what makes headless runs cheap to iterate on.
          - name: test-headless
            command: cargo test -p outbound --no-default-features --verbose
          - name: doc
            command: cargo doc --workspace --no-deps
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: outbound-dev
          path: /tmp
      - run: docker load --input /tmp/outbound-dev.tar
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$(pwd)":/code -w /code outbound-dev ${{ matrix.command }}

  cargo-release-build:
    needs: docker-build-outbound-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: outbound-dev
          path: /tmp
      - run: docker load --input /tmp/outbound-dev.tar
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$(pwd)":/code -w /code outbound-dev cargo build --release --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: outbound-linux-amd64-ubuntu
          path: target/release/outbound
